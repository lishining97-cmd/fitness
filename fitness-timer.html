<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>健身间歇计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --exercise: #ff5e3a;
    --exercise-2: #ff2a68;
    --rest: #34d1bf;
    --rest-2: #2bc0b0;
    --idle: #4a5568;
    --bg: #0f1419;
    --card: rgba(255,255,255,0.06);
    --text: #ecf0f1;
    --muted: #8a96a3;
    --accent: var(--idle);
    --accent-2: var(--idle);
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a2028 0%, var(--bg) 60%);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
    max-width: 540px;
    margin: 0 auto;
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 2px 6px;
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: 1px; color: var(--muted); }
  .icon-btn {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 12px;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .15s;
  }
  .icon-btn:active { transform: scale(0.92); }

  /* Timer stage */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
  }
  .ring-wrap {
    position: relative;
    width: min(72vw, 300px);
    height: min(72vw, 300px);
    display: flex; align-items: center; justify-content: center;
  }
  .ring-wrap svg {
    position: absolute; inset: 0;
    transform: rotate(-90deg);
    transition: filter .4s;
  }
  .ring-bg { stroke: rgba(255,255,255,0.08); }
  .ring-fg {
    stroke: var(--accent);
    transition: stroke 0.4s ease, stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 10px var(--accent));
  }
  .center {
    text-align: center;
    z-index: 2;
  }
  .phase-label {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
    transition: color .4s;
    text-shadow: 0 0 18px var(--accent);
  }
  .time {
    font-size: clamp(64px, 22vw, 110px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color .3s, transform .2s;
  }
  .time.tick { transform: scale(1.04); }
  .set-progress {
    display: flex; gap: 7px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 280px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: all .3s;
  }
  .dot.done { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.active { background: var(--accent); transform: scale(1.5); box-shadow: 0 0 12px var(--accent); }
  .set-progress--bar { width: min(70vw, 280px); }
  .set-bar {
    width: 100%; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.12); overflow: hidden;
  }
  .set-bar-fill {
    height: 100%; border-radius: 4px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transition: width .3s linear, background .4s;
  }
  .set-counter {
    font-size: 13px; color: var(--muted);
    letter-spacing: 1px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 14px;
    justify-content: center;
    padding: 8px 0 20px;
  }
  .ctrl {
    border: none;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 22px;
    transition: transform .15s, box-shadow .3s;
    color: white;
  }
  .ctrl:active { transform: scale(0.92); }
  .ctrl-secondary {
    width: 60px; height: 60px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 20px;
  }
  .ctrl-primary {
    width: 82px; height: 82px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 22px var(--accent);
    font-size: 26px;
  }
  .ctrl-primary[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }

  /* Settings sheet */
  .sheet-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 50;
  }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #161c24;
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px 22px 0 0;
    padding: 20px 22px calc(env(safe-area-inset-bottom) + 24px);
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.22,1,.36,1);
    z-index: 51;
    max-width: 540px; margin: 0 auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    margin: -8px auto 18px;
  }
  .sheet h2 {
    font-size: 17px; font-weight: 700; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sheet h2 span { color: var(--muted); font-size: 12px; font-weight: 500; }

  .field { margin-bottom: 20px; }
  .field-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .field-label { font-size: 15px; color: var(--text); font-weight: 500; }
  .field-value {
    font-size: 20px; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .field-value .unit { font-size: 12px; color: var(--muted); margin-left: 3px; font-weight: 500; }

  .stepper {
    display: flex; align-items: center; gap: 10px;
  }
  .stepper button {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--card); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 22px; cursor: pointer;
    transition: transform .12s, background .2s;
    flex-shrink: 0;
  }
  .stepper button:active { transform: scale(0.9); background: rgba(255,255,255,0.12); }
  .stepper input[type=range] {
    flex: 1; height: 6px; -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.12); border-radius: 3px; outline: none;
  }
  .stepper input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 10px var(--accent);
    border: 3px solid #161c24;
  }
  .stepper input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 3px solid #161c24;
  }

  /* Big stepper: editable number + large +/- + quick chips */
  .field--work { --field-accent: var(--exercise); }
  .field--rest { --field-accent: var(--rest); }

  .big-stepper {
    display: flex; align-items: stretch; gap: 10px;
    margin-bottom: 10px;
  }
  .step-btn {
    width: 54px; flex-shrink: 0;
    border-radius: 14px;
    background: var(--card); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 26px; cursor: pointer; font-weight: 600;
    transition: transform .12s, background .2s, border-color .2s, color .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .step-btn:active { transform: scale(0.9); }
  .step-btn:disabled { opacity: .35; cursor: not-allowed; }
  .field--work .step-btn { color: var(--exercise); border-color: rgba(255,94,58,0.25); }
  .field--rest .step-btn { color: var(--rest); border-color: rgba(52,209,191,0.25); }

  .step-display {
    flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 4px;
    background: var(--card);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 6px 12px;
    transition: border-color .25s, box-shadow .25s;
  }
  .step-display:focus-within {
    border-color: var(--field-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--field-accent) 22%, transparent);
  }
  .num-input {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 30px; font-weight: 800;
    text-align: center; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
    padding: 0;
  }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .step-unit { font-size: 14px; color: var(--muted); font-weight: 600; }

  .quick-chips { display: flex; gap: 6px; }
  .chip {
    flex: 1 1 0; min-width: 0;
    padding: 8px 2px; border-radius: 10px;
    background: var(--card); border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted); font-size: 13px; font-weight: 600;
    text-align: center; cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s, color .15s;
    font-variant-numeric: tabular-nums;
  }
  .chip:active { transform: scale(0.92); }
  .chip.active {
    background: color-mix(in srgb, var(--field-accent) 20%, transparent);
    border-color: var(--field-accent);
    color: var(--field-accent);
  }

  .presets {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    margin-bottom: 8px;
  }
  .preset {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 6px; cursor: pointer;
    text-align: center; transition: transform .12s, border-color .2s;
  }
  .preset:active { transform: scale(0.95); }
  .preset-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .preset-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .12s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.08); }
  .btn-primary { background: linear-gradient(145deg, #4a90e2, #357abd); color: white; }

  .beep-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: var(--card);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  }
  .switch {
    position: relative; width: 44px; height: 26px;
    background: rgba(255,255,255,0.18); border-radius: 13px;
    cursor: pointer; transition: background .25s;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: white;
    transition: transform .25s;
  }
  .switch.on::after { transform: translateX(18px); }

  @media (max-height: 640px) {
    .ring-wrap { width: min(60vw, 240px); height: min(60vw, 240px); }
    .phase-label { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">FIT TIMER</div>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button>
  </div>

  <div class="stage">
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="92" fill="none" stroke-width="10"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="92" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="0"></circle>
      </svg>
      <div class="center">
        <div class="phase-label" id="phaseLabel">准备</div>
        <div class="time" id="time">05</div>
        <div class="set-counter" id="setCounter">第 0 / 0 组</div>
      </div>
    </div>
    <div class="set-progress" id="setProgress"></div>
  </div>

  <div class="controls">
    <button class="ctrl ctrl-secondary" id="resetBtn" aria-label="重置">↺</button>
    <button class="ctrl ctrl-primary" id="startBtn">▶</button>
    <button class="ctrl ctrl-secondary" id="skipBtn" aria-label="跳过">⏭</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>训练设置 <span>直接输入或选择常用值</span></h2>

  <div class="presets" id="presets">
    <div class="preset" data-w="8" data-r="8" data-s="45"><div class="preset-name">阶段一</div><div class="preset-desc">8s / 8s · 45组</div></div>
    <div class="preset" data-w="5" data-r="5" data-s="8"><div class="preset-name">短间歇</div><div class="preset-desc">5s / 5s · 8组</div></div>
    <div class="preset" data-w="20" data-r="10" data-s="8"><div class="preset-name">Tabata</div><div class="preset-desc">20s / 10s · 8组</div></div>
    <div class="preset" data-w="40" data-r="20" data-s="6"><div class="preset-name">耐力</div><div class="preset-desc">40s / 20s · 6组</div></div>
  </div>

  <div class="field field--work">
    <div class="field-row">
      <span class="field-label">训练时长</span>
    </div>
    <div class="big-stepper">
      <button class="step-btn" data-step="-1" data-target="work" aria-label="减少">−</button>
      <div class="step-display">
        <input type="number" id="workNum" class="num-input" min="1" max="180" step="1" value="8" inputmode="numeric">
        <span class="step-unit">秒</span>
      </div>
      <button class="step-btn" data-step="1" data-target="work" aria-label="增加">+</button>
    </div>
    <div class="quick-chips" data-target="work">
      <span class="chip" data-v="5">5</span>
      <span class="chip" data-v="10">10</span>
      <span class="chip" data-v="15">15</span>
      <span class="chip" data-v="20">20</span>
      <span class="chip" data-v="30">30</span>
      <span class="chip" data-v="45">45</span>
      <span class="chip" data-v="60">60</span>
      <span class="chip" data-v="90">90</span>
    </div>
  </div>

  <div class="field field--rest">
    <div class="field-row">
      <span class="field-label">放松时长</span>
    </div>
    <div class="big-stepper">
      <button class="step-btn" data-step="-1" data-target="rest" aria-label="减少">−</button>
      <div class="step-display">
        <input type="number" id="restNum" class="num-input" min="1" max="180" step="1" value="8" inputmode="numeric">
        <span class="step-unit">秒</span>
      </div>
      <button class="step-btn" data-step="1" data-target="rest" aria-label="增加">+</button>
    </div>
    <div class="quick-chips" data-target="rest">
      <span class="chip" data-v="5">5</span>
      <span class="chip" data-v="10">10</span>
      <span class="chip" data-v="15">15</span>
      <span class="chip" data-v="20">20</span>
      <span class="chip" data-v="30">30</span>
      <span class="chip" data-v="45">45</span>
      <span class="chip" data-v="60">60</span>
      <span class="chip" data-v="90">90</span>
    </div>
  </div>

  <div class="field">
    <div class="field-row">
      <span class="field-label">训练组数</span>
      <span class="field-value"><span id="setsVal">45</span><span class="unit">组</span></span>
    </div>
    <div class="stepper">
      <button data-step="-1" data-target="sets">−</button>
      <input type="range" id="setsSlider" min="1" max="100" step="1" value="45">
      <button data-step="1" data-target="sets">+</button>
    </div>
  </div>

  <div class="beep-toggle">
    <span class="field-label">声音提示</span>
    <div class="switch on" id="soundSwitch"></div>
  </div>

  <div class="sheet-actions">
    <button class="btn btn-ghost" id="closeSheetBtn">取消</button>
    <button class="btn btn-primary" id="applyBtn">应用并重置</button>
  </div>
</div>

<script>
(function(){
  const R = 92;
  const CIRC = 2 * Math.PI * R; // 578.05

  // State
  const state = {
    work: 8, rest: 8, sets: 45,
    soundOn: true,
    running: false,
    phase: 'ready', // ready | work | rest | done
    remaining: 0,       // seconds remaining in current phase
    currentSet: 0,      // 0-indexed completed sets; current set being worked = currentSet+1 during work
    rafId: null,
    lastTick: 0,
  };

  // Draft settings (in sheet)
  const draft = { work: 8, rest: 8, sets: 45 };

  const $ = id => document.getElementById(id);
  const phaseLabel = $('phaseLabel');
  const timeEl = $('time');
  const setCounter = $('setCounter');
  const setProgress = $('setProgress');
  const ringFg = $('ringFg');
  const startBtn = $('startBtn');
  const resetBtn = $('resetBtn');
  const skipBtn = $('skipBtn');
  const sheet = $('sheet');
  const sheetMask = $('sheetMask');
  const settingsBtn = $('settingsBtn');
  const closeSheetBtn = $('closeSheetBtn');
  const applyBtn = $('applyBtn');
  const soundSwitch = $('soundSwitch');

  // Audio (Web Audio API beeps)
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, vol){
    if (!state.soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol || 0.3, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.15));
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.15) + 0.02);
  }
  function tickBeep(){ beep(880, 0.08, 0.18); }
  function workStartBeep(){ beep(440, 0.12, 0.32); setTimeout(()=>beep(660,0.12,0.32),140); }
  function restStartBeep(){ beep(660, 0.12, 0.3); }
  function doneBeep(){
    beep(523,0.18,0.35); setTimeout(()=>beep(659,0.18,0.35),200);
    setTimeout(()=>beep(784,0.32,0.35),400);
  }

  // Apply theme by phase
  function setTheme(phase){
    const root = document.documentElement.style;
    if (phase === 'work') {
      root.setProperty('--accent', 'var(--exercise)');
      root.setProperty('--accent-2', 'var(--exercise-2)');
    } else if (phase === 'rest') {
      root.setProperty('--accent', 'var(--rest)');
      root.setProperty('--accent-2', 'var(--rest-2)');
    } else {
      root.setProperty('--accent', 'var(--idle)');
      root.setProperty('--accent-2', 'var(--idle)');
    }
  }

  function render(){
    // phase label
    const labels = { ready:'准备', work:'训练', rest:'放松', done:'完成' };
    phaseLabel.textContent = labels[state.phase];
    setTheme(state.phase);

    // time display
    let t;
    if (state.phase === 'ready') t = state.work;          // preview upcoming work duration
    else if (state.phase === 'done') t = 0;               // finished
    else t = Math.max(0, Math.ceil(state.remaining));     // counting down
    timeEl.textContent = String(t).padStart(2,'0');

    // ring progress (fraction completed of current phase)
    let total = 1, done = 0;
    if (state.phase === 'work') { total = state.work; done = state.work - state.remaining; }
    else if (state.phase === 'rest') { total = state.rest; done = state.rest - state.remaining; }
    else if (state.phase === 'ready' || state.phase === 'done') { total = 1; done = 1; }
    const frac = Math.max(0, Math.min(1, done / total));
    ringFg.style.strokeDasharray = CIRC;
    ringFg.style.strokeDashoffset = CIRC * (1 - frac);

    // set counter text
    if (state.phase === 'ready') {
      setCounter.textContent = `共 ${state.sets} 组`;
    } else if (state.phase === 'done') {
      setCounter.textContent = `完成 ${state.sets} 组`;
    } else {
      const cur = state.phase === 'work' ? state.currentSet + 1 : state.currentSet + 1;
      setCounter.textContent = `第 ${cur} / ${state.sets} 组`;
    }

    // set progress: dots for few sets, slim bar for many
    setProgress.className = 'set-progress';
    setProgress.innerHTML = '';
    const MAX_DOTS = 24;
    if (state.sets <= MAX_DOTS) {
      for (let i = 0; i < state.sets; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        if (i < state.currentSet) d.classList.add('done');
        else if (i === state.currentSet && (state.phase === 'work' || state.phase === 'rest')) d.classList.add('active');
        setProgress.appendChild(d);
      }
    } else {
      // condensed: overall progress bar through all sets
      setProgress.className = 'set-progress set-progress--bar';
      const bar = document.createElement('div');
      bar.className = 'set-bar';
      const fill = document.createElement('div');
      fill.className = 'set-bar-fill';
      let overall = state.currentSet; // completed sets
      if (state.phase === 'work') overall = state.currentSet + (1 - state.remaining / state.work) * 0.5;
      else if (state.phase === 'rest') overall = state.currentSet + 0.5 + (1 - state.remaining / state.rest) * 0.5;
      overall = Math.max(0, Math.min(state.sets, overall));
      fill.style.width = (overall / state.sets * 100) + '%';
      bar.appendChild(fill);
      setProgress.appendChild(bar);
    }

    // start button label
    if (state.phase === 'done') startBtn.textContent = '↻';
    else if (state.running) startBtn.textContent = '❚❚';
    else startBtn.textContent = '▶';
  }

  function startLoop(){
    if (state.rafId) return;
    state.lastTick = performance.now();
    state.rafId = requestAnimationFrame(loop);
  }
  function stopLoop(){
    if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
  }
  function loop(now){
    if (!state.running) { stopLoop(); return; }
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    const before = state.remaining;
    state.remaining -= dt;

    // Countdown beeps at last 3 seconds
    const beforeCeil = Math.ceil(before);
    const afterCeil = Math.ceil(state.remaining);
    if (afterCeil < beforeCeil && afterCeil >= 1 && afterCeil <= 3) {
      tickBeep();
      timeEl.classList.add('tick');
      setTimeout(()=>timeEl.classList.remove('tick'), 180);
    }

    if (state.remaining <= 0) {
      advancePhase();
    } else {
      render();
    }
    state.rafId = requestAnimationFrame(loop);
  }

  // A "set" = one work + one rest. currentSet is 0-indexed set in progress.
  function advancePhase(){
    if (state.phase === 'work') {
      // work done -> rest (same set)
      state.phase = 'rest';
      state.remaining = state.rest;
      restStartBeep();
    } else if (state.phase === 'rest') {
      // rest done -> set fully complete
      state.currentSet += 1;
      if (state.currentSet >= state.sets) { finish(); return; }
      state.phase = 'work';
      state.remaining = state.work;
      workStartBeep();
    } else {
      // start first work of first set
      state.phase = 'work';
      state.remaining = state.work;
      state.currentSet = 0;
      workStartBeep();
    }
    render();
  }

  function finish(){
    state.phase = 'done';
    state.running = false;
    state.remaining = 0;
    stopLoop();
    render();
    doneBeep();
  }

  function start(){
    ensureAudio();
    if (state.phase === 'done') { reset(); }
    if (state.phase === 'ready') {
      state.phase = 'work';
      state.remaining = state.work;
      state.currentSet = 0;
      workStartBeep();
    }
    state.running = true;
    render();
    startLoop();
  }
  function pause(){
    state.running = false;
    stopLoop();
    render();
  }
  function toggle(){
    if (state.running) pause(); else start();
  }
  function reset(){
    state.running = false;
    stopLoop();
    state.phase = 'ready';
    state.remaining = 0;
    state.currentSet = 0;
    render();
  }
  function skip(){
    if (state.phase === 'ready' || state.phase === 'done') return;
    // jump to end of current phase
    state.remaining = 0;
    advancePhase();
    if (state.running) { stopLoop(); startLoop(); }
    else render();
  }

  // ---------- Settings sheet ----------
  function openSheet(){
    draft.work = state.work; draft.rest = state.rest; draft.sets = state.sets;
    syncSheetFromDraft();
    sheet.classList.add('show');
    sheetMask.classList.add('show');
  }
  function closeSheet(){
    sheet.classList.remove('show');
    sheetMask.classList.remove('show');
  }
  function syncSheetFromDraft(){
    $('workNum').value = draft.work;
    $('restNum').value = draft.rest;
    $('setsSlider').value = draft.sets;
    $('setsVal').textContent = draft.sets;
    updateChipsActive('work', draft.work);
    updateChipsActive('rest', draft.rest);
  }
  function updateChipsActive(target, v){
    document.querySelectorAll(`.quick-chips[data-target="${target}"] .chip`).forEach(c=>{
      c.classList.toggle('active', +c.dataset.v === v);
    });
  }
  function clampInt(v, min, max, fallback){
    v = parseInt(v, 10);
    if (isNaN(v)) return fallback;
    return Math.max(min, Math.min(max, v));
  }
  function applyDraft(){
    state.work = draft.work;
    state.rest = draft.rest;
    state.sets = draft.sets;
    reset();
    closeSheet();
  }

  // Stepper +/- buttons (work/rest big stepper + sets slider)
  document.querySelectorAll('[data-step][data-target]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const step = parseInt(btn.dataset.step, 10);
      const target = btn.dataset.target;
      const input = target === 'work' ? $('workNum') : target === 'rest' ? $('restNum') : $('setsSlider');
      let v = parseInt(input.value, 10) + step;
      v = Math.max(parseInt(input.min,10), Math.min(parseInt(input.max,10), v));
      input.value = v;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });

  // Number inputs -> draft (work/rest)
  function wireNumberInput(el, key, min, max){
    el.addEventListener('input', ()=>{
      const raw = el.value;
      if (raw === '') return; // let user clear while typing; clamped on blur
      const v = clampInt(raw, min, max, draft[key]);
      draft[key] = v;
      updateChipsActive(key, v);
    });
    el.addEventListener('blur', ()=>{
      const v = clampInt(el.value, min, max, draft[key]);
      el.value = v;
      draft[key] = v;
      updateChipsActive(key, v);
    });
    el.addEventListener('keydown', e=>{
      if (e.code === 'Enter') el.blur();
    });
  }
  wireNumberInput($('workNum'), 'work', 1, 180);
  wireNumberInput($('restNum'), 'rest', 1, 180);
  $('setsSlider').addEventListener('input', e=>{ draft.sets = +e.target.value; $('setsVal').textContent = draft.sets; });

  // Quick chips
  document.querySelectorAll('.quick-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const target = chip.parentElement.dataset.target;
      const v = +chip.dataset.v;
      const input = target === 'work' ? $('workNum') : $('restNum');
      input.value = v;
      draft[target] = v;
      updateChipsActive(target, v);
      input.blur();
    });
  });

  document.querySelectorAll('.preset').forEach(p=>{
    p.addEventListener('click', ()=>{
      draft.work = +p.dataset.w;
      draft.rest = +p.dataset.r;
      draft.sets = +p.dataset.s;
      syncSheetFromDraft();
    });
  });

  soundSwitch.addEventListener('click', ()=>{
    soundSwitch.classList.toggle('on');
    state.soundOn = soundSwitch.classList.contains('on');
    if (state.soundOn) { ensureAudio(); tickBeep(); }
  });

  settingsBtn.addEventListener('click', openSheet);
  closeSheetBtn.addEventListener('click', closeSheet);
  sheetMask.addEventListener('click', closeSheet);
  applyBtn.addEventListener('click', applyDraft);

  startBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  skipBtn.addEventListener('click', skip);

  // Keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyR') reset();
    else if (e.code === 'KeyS') skip();
    else if (e.code === 'Escape') closeSheet();
  });

  // Keep screen on during workout
  let wakeLock = null;
  async function requestWakeLock(){
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
  }
  function releaseWakeLock(){ if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; } }
  document.addEventListener('visibilitychange', ()=>{
    if (state.running && document.visibilityState === 'visible') requestWakeLock();
  });
  const origStart = start;
  start = function(){ requestWakeLock(); origStart(); };
  const origPause = pause;
  pause = function(){ releaseWakeLock(); origPause(); };
  const origFinish = finish;
  finish = function(){ releaseWakeLock(); origFinish(); };

  // Init
  reset();
})();
</script>


</body></html>
